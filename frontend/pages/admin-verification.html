<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alumni Verification | Alumni Connect</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="dashboard-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>ADMIN DASHBOARD</h2>
      </div>
      <ul class="sidebar-nav">
        <li><a href="admin-dashboard.html">Dashboard</a></li>
        <li><a href="admin-users.html">User Management</a></li>
        <li><a href="admin-verification.html" class="active">Alumni Verification</a></li>
        <li><a href="admin-events.html">Event Management</a></li>
        <li><a href="announcements.html">Announcements</a></li>
        <li><a href="admin-reports.html">Reports & Statistics</a></li>
        <li><a href="#" onclick="logout()">Logout</a></li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Top Bar -->
      <div class="top-bar">
        <div class="user-info">
          <h1>Alumni Verification</h1>
        </div>
        <div class="user-info">
          <div class="user-avatar" id="user-avatar">A</div>
          <span id="user-name">Admin</span>
          <button class="btn btn-secondary" onclick="logout()">Logout</button>
        </div>
      </div>

      <!-- Verification Content -->
      <div class="dashboard-grid">
        <!-- Filter Section -->
        <div class="card" style="grid-column: span 2;">
          <h3>Filter Alumni</h3>
          <div class="search-bar">
            <select id="filter-status">
              <option value="PENDING">Pending Verification</option>
              <option value="VERIFIED">Verified Alumni</option>
              <option value="REJECTED">Rejected Alumni</option>
              <option value="ALL">All Alumni</option>
            </select>
            <button onclick="filterAlumni()">Filter</button>
          </div>
        </div>

        <!-- Verification List -->
        <div class="card" style="grid-column: span 2;">
          <h3>Alumni Verification List</h3>
          <div id="verification-list">
            <p>Loading alumni verification data...</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/auth.js"></script>
  <script src="../js/admin-verification.js"></script>
</body>
</html>
