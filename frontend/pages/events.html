<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events | Alumni Connect</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="dashboard-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>ALUMNI CONNECT</h2>
      </div>
      <ul class="sidebar-nav">
        <li><a href="#" onclick="goToDashboard()">Dashboard</a></li>
        <li><a href="directory.html">Find Alumni</a></li>
        <li><a href="profile.html">My Profile</a></li>
        <li><a href="connections.html">Connections</a></li>
        <li><a href="mentorship.html">Mentorship</a></li>
        <li><a href="events.html" class="active">Events</a></li>
        <li><a href="jobs.html">Career Opportunities</a></li>
        <li><a href="#" onclick="logout()">Logout</a></li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Top Bar -->
      <div class="top-bar">
        <div class="user-info">
          <h1>Events</h1>
        </div>
        <div class="user-info">
          <div class="user-avatar" id="user-avatar">U</div>
          <span id="user-name">User</span>
          <button class="btn btn-secondary" onclick="logout()">Logout</button>
        </div>
      </div>

      <!-- Events Content -->
      <div class="dashboard-grid">
        <!-- Create Event (for faculty/admin) -->
        <div class="card" style="grid-column: span 2;" id="create-event-card" style="display: none;">
          <h3>Create Event</h3>
          <form id="create-event-form">
            <div class="form-group">
              <label for="event-title">Event Title</label>
              <input type="text" id="event-title" name="title" required>
            </div>

            <div class="form-group">
              <label for="event-description">Description</label>
              <textarea id="event-description" name="description" rows="3"></textarea>
            </div>

            <div class="form-group">
              <label for="event-date">Date & Time</label>
              <input type="datetime-local" id="event-date" name="eventDate" required>
            </div>

            <div class="form-group">
              <label for="event-venue">Venue</label>
              <input type="text" id="event-venue" name="venue">
            </div>

            <div class="form-group">
              <label for="event-capacity">Capacity</label>
              <input type="number" id="event-capacity" name="capacity" min="1">
            </div>

            <div class="form-group">
              <label for="event-type">Event Type</label>
              <select id="event-type" name="type">
                <option value="General">General</option>
                <option value="Career Talk">Career Talk</option>
                <option value="Networking">Networking</option>
                <option value="Workshop">Workshop</option>
                <option value="Seminar">Seminar</option>
                <option value="Alumni Meet">Alumni Meet</option>
              </select>
            </div>

            <button type="submit" class="btn btn-success">Create Event</button>
          </form>
        </div>

        <!-- Upcoming Events -->
        <div class="card" style="grid-column: span 2;">
          <h3>Upcoming Events</h3>
          <div id="upcoming-events">
            <p>No upcoming events.</p>
          </div>
        </div>

        <!-- My Registrations -->
        <div class="card" style="grid-column: span 2;">
          <h3>My Event Registrations</h3>
          <div id="my-registrations">
            <p>No event registrations yet.</p>
          </div>
        </div>

        <!-- Past Events -->
        <div class="card" style="grid-column: span 2;">
          <h3>Past Events</h3>
          <div id="past-events">
            <p>No past events.</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/auth.js"></script>
  <script src="../js/events.js"></script>
</body>
</html>
